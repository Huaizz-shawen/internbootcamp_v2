# Configuration for 3D Maze Instruction Generation

# Global configuration
global_config:
  class_name: "internbootcamp.bootcamps.maze3d.maze3d_instruction_generator.Maze3DInstructionGenerator"

# Multiple instruction generator configurations
instruction_generators:
  easy_path_finding:
    generation_ratio: 0.25  # 25% of generated puzzles
    config:
      grid_size: [6, 6, 5]
      puzzle_types: ["path_finding"]
      main_path_length: [3, 5]
      side_path_num: [2, 3]
      side_path_length: [1, 2]
      save_images: true
      seed: null

  medium_path_finding:
    generation_ratio: 0.25
    config:
      grid_size: [8, 8, 7]
      puzzle_types: ["path_finding"]
      main_path_length: [5, 7]
      side_path_num: [3, 4]
      side_path_length: [1, 2]
      save_images: true
      seed: null

  sequence_finding:
    generation_ratio: 0.2
    config:
      grid_size: [8, 8, 7]
      puzzle_types: ["sequence_finding"]
      main_path_length: [5, 7]
      label_num_range: [3, 4]
      save_images: true
      seed: null

  height_comparison:
    generation_ratio: 0.15
    config:
      grid_size: [8, 8, 7]
      puzzle_types: ["height_comparison"]
      main_path_length: [5, 7]
      label_num_range: [3, 3]
      save_images: true
      seed: null

  main_path:
    generation_ratio: 0.15
    config:
      grid_size: [8, 8, 7]
      puzzle_types: ["main_path"]
      main_path_length: [5, 7]
      side_path_num: [3, 4]
      side_path_length: [1, 2]
      save_images: true
      seed: null
